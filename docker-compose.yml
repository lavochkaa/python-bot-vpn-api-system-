version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vpnbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    env_file: .env
    depends_on:
      - db
    command: python -m bot.main

  combiner:
    build: .
    env_file: .env
    depends_on:
      - db
    command: python sub_combiner.py
    ports:
      - "5000:5000"

volumes:
  pgdata:
