services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vpnbot
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    env_file: .env
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://vpnbot:secret@db:5432/vpnbot
    command: python -m bot.main

volumes:
  pgdata:
